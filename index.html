<!doctype html> <html lang="en"> <head> <meta charset="UTF-8" /> <!-- Meta Glass simulator viewport --> <meta name="viewport" content="width=600, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" /> <!-- Required Meta Web App metadata --> <meta name="description" content="POWERCONNECT.AI wearable web app for Meta Ray-Ban Display glasses." /> <meta name="mrbd-web-app-capable" content="yes" /> <!-- Raster favicon - NOT SVG --> <link rel="icon" type="image/png" href="/favicon.png" /> <title>POWERCONNECT.AI</title> <style> /* * ============================================================ * GLOBAL RESET * ============================================================ */ * { box-sizing: border-box; } html, body { width: 600px; height: 600px; margin: 0; padding: 0; overflow: hidden; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 18px; } body { display: flex; align-items: center; justify-content: center; } /* * ============================================================ * ROOT APPLICATION * ============================================================ */ #root { width: 600px; height: 600px; overflow: hidden; } /* * ============================================================ * APPLICATION CONTAINER * ============================================================ */ .app { width: 600px; height: 600px; padding: 24px; display: flex; flex-direction: column; overflow: hidden; } /* * ============================================================ * HEADER * ============================================================ */ .header { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-shrink: 0; } .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; line-height: 1.2; } .status { font-size: 18px; line-height: 1.35; opacity: 0.7; white-space: nowrap; } /* * ============================================================ * MAIN SCREEN * ============================================================ */ .screen { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; overflow: hidden; } /* * ============================================================ * TYPOGRAPHY * ============================================================ */ .title { font-size: 28px; line-height: 1.2; font-weight: 700; margin-bottom: 12px; overflow-wrap: break-word; } .subtitle { font-size: 18px; line-height: 1.4; margin-bottom: 24px; opacity: 0.75; overflow-wrap: break-word; } /* * ============================================================ * NAVIGATION CARDS * ============================================================ */ .card { width: 100%; min-height: 82px; border: 2px solid #555; border-radius: 14px; padding: 16px; margin-bottom: 10px; background: #000; color: #fff; cursor: pointer; display: flex; flex-direction: column; justify-content: center; outline: none; transition: transform 0.15s ease, border-color 0.15s ease; } .card:focus, .card.selected { border-color: #fff; transform: scale(1.01); } .card:active { transform: scale(0.98); } .card-title { font-size: 20px; line-height: 1.3; font-weight: 700; margin-bottom: 5px; overflow-wrap: break-word; } .card-description { font-size: 18px; line-height: 1.35; opacity: 0.65; overflow-wrap: break-word; } /* * ============================================================ * RESULT SCREEN * ============================================================ */ .result-container { width: 100%; } .response { width: 100%; border: 2px solid #555; border-radius: 14px; padding: 20px; margin-bottom: 20px; overflow: hidden; } .response-label { font-size: 18px; line-height: 1.35; opacity: 0.65; margin-bottom: 8px; overflow-wrap: break-word; } .response-value { font-size: 28px; line-height: 1.2; font-weight: 700; overflow-wrap: break-word; word-break: break-word; } /* * ============================================================ * BACK BUTTON * ============================================================ */ .back-button { width: 100%; min-height: 56px; border: 2px solid #555; border-radius: 12px; padding: 14px; background: #000; color: #fff; text-align: center; cursor: pointer; font-size: 18px; line-height: 1.35; font-weight: 600; display: flex; align-items: center; justify-content: center; outline: none; } .back-button:focus, .back-button.selected { border-color: #fff; } .back-button:active { transform: scale(0.98); } /* * ============================================================ * FOOTER * ============================================================ */ .footer { width: 100%; flex-shrink: 0; padding-top: 12px; text-align: center; font-size: 18px; line-height: 1.35; opacity: 0.5; overflow-wrap: break-word; } /* * ============================================================ * HIDDEN STATE * ============================================================ * * This is only for rendering. * * Navigation itself is controlled by browser history. */ .hidden { display: none !important; } </style> </head> <body> <div id="root"> <div class="app"> <!-- ====================================================== HEADER ====================================================== --> <header class="header"> <div class="logo"> POWERCONNECT.AI </div> <div class="status" id="status" > ONLINE </div> </header> <!-- ====================================================== HOME SCREEN Route: / ====================================================== --> <main id="homeScreen" class="screen" aria-label="POWERCONNECT home" > <div class="title"> Hello </div> <div class="subtitle"> What would you like to check? </div> <!-- Account Balance --> <div class="card" id="balanceCard" tabindex="0" role="button" aria-label="Account Balance" > <div class="card-title"> Account Balance </div> <div class="card-description"> View your current balance </div> </div> <!-- Latest Bill --> <div class="card" id="billCard" tabindex="0" role="button" aria-label="Latest Bill" > <div class="card-title"> Latest Bill </div> <div class="card-description"> View your latest billing information </div> </div> <!-- Usage --> <div class="card" id="usageCard" tabindex="0" role="button" aria-label="Usage" > <div class="card-title"> Usage </div> <div class="card-description"> View your electricity usage </div> </div> </main> <!-- ====================================================== RESULT SCREEN Routes: /balance /bill /usage ====================================================== --> <main id="resultScreen" class="screen hidden" aria-label="POWERCONNECT result" > <div class="result-container"> <div class="title" id="resultTitle" > Account Balance </div> <div class="response"> <div class="response-label" id="responseLabel" > CURRENT BALANCE </div> <div class="response-value" id="responseValue" > $124.52 </div> </div> <div class="back-button" id="backButton" tabindex="0" role="button" aria-label="Back" > ← Back </div> </div> </main> <!-- ====================================================== FOOTER ====================================================== --> <footer class="footer"> Swipe to navigate • Pinch to select </footer> </div> </div> <script> /* * ========================================================== * POWERCONNECT.AI META GLASS WEB APP * ========================================================== * * Navigation model: * * / Home * /balance Account Balance * /bill Latest Bill * /usage Usage * * Every real screen transition uses history.pushState(). * * Selection/focus does NOT create history entries. * * Browser Back/Forward is handled with popstate. * ========================================================== */ /* * ========================================================== * SCREEN DATA * ========================================================== */ const screens = { home: { route: "/", title: "POWERCONNECT.AI" }, balance: { route: "/balance", title: "Account Balance", label: "CURRENT BALANCE", value: "$124.52" }, bill: { route: "/bill", title: "Latest Bill", label: "AMOUNT DUE", value: "$86.41" }, usage: { route: "/usage", title: "Usage", label: "CURRENT USAGE", value: "642 kWh" } }; /* * ========================================================== * DOM REFERENCES * ========================================================== */ const homeScreen = document.getElementById("homeScreen"); const resultScreen = document.getElementById("resultScreen"); const resultTitle = document.getElementById("resultTitle"); const responseLabel = document.getElementById("responseLabel"); const responseValue = document.getElementById("responseValue"); const backButton = document.getElementById("backButton"); const balanceCard = document.getElementById("balanceCard"); const billCard = document.getElementById("billCard"); const usageCard = document.getElementById("usageCard"); /* * ========================================================== * ROUTE RESOLUTION * ========================================================== */ function getScreenFromPath(path) { switch (path) { case "/balance": return "balance"; case "/bill": return "bill"; case "/usage": return "usage"; case "/": case "": default: return "home"; } } /* * ========================================================== * RENDER SCREEN * ========================================================== * * IMPORTANT: * * renderScreen() does NOT modify browser history. * * This means browser Back/Forward does not generate * additional history entries. * ========================================================== */ function renderScreen(screenName) { const screen = screens[screenName] || screens.home; /* * HOME */ if (screenName === "home") { homeScreen.classList.remove("hidden"); resultScreen.classList.add("hidden"); return; } /* * RESULT SCREEN */ homeScreen.classList.add("hidden"); resultScreen.classList.remove("hidden"); resultTitle.textContent = screen.title; responseLabel.textContent = screen.label; responseValue.textContent = screen.value; /* * Make sure result screen starts with * the Back button focused. */ backButton.focus(); } /* * ========================================================== * STANDARD BROWSER NAVIGATION * ========================================================== * * Every actual screen change gets a same-origin history * entry using pushState(). * ========================================================== */ function navigateTo(screenName) { const screen = screens[screenName]; if (!screen) { return; } /* * Do not create a duplicate entry if we're * already on the requested route. */ if ( window.location.pathname === screen.route ) { renderScreen(screenName); return; } window.history.pushState( { screen: screenName }, "", screen.route ); renderScreen(screenName); } /* * ========================================================== * BROWSER BACK / FORWARD * ========================================================== */ window.addEventListener( "popstate", function () { const screenName = getScreenFromPath( window.location.pathname ); renderScreen(screenName); } ); /* * ========================================================== * CARD NAVIGATION * ========================================================== */ balanceCard.addEventListener( "click", function () { navigateTo("balance"); } ); billCard.addEventListener( "click", function () { navigateTo("bill"); } ); usageCard.addEventListener( "click", function () { navigateTo("usage"); } ); /* * ========================================================== * BACK BUTTON * ========================================================== * * Use browser history when possible. * * This is a real navigation action, not merely a * display toggle. * ========================================================== */ function goBack() { if ( window.history.length > 1 && window.location.pathname !== "/" ) { window.history.back(); return; } /* * Fallback when the app was opened directly at * a result URL. * * replaceState avoids creating another history * entry. */ window.history.replaceState( { screen: "home" }, "", "/" ); renderScreen("home"); } backButton.addEventListener( "click", goBack ); /* * ========================================================== * KEYBOARD ACCESS * ========================================================== * * Useful for simulator/browser testing. * * Arrow navigation changes focus only. * It DOES NOT create browser history entries. * * Enter activates the focused control. * Escape performs navigation back. * ========================================================== */ const cards = [ balanceCard, billCard, usageCard ]; let selectedIndex = 0; function updateSelection() { cards.forEach( function (card, index) { if (index === selectedIndex) { card.classList.add("selected"); card.focus(); } else { card.classList.remove("selected"); } } ); } document.addEventListener( "keydown", function (event) { /* * ------------------------------------------------------ * HOME SCREEN KEYBOARD NAVIGATION * ------------------------------------------------------ */ if ( !homeScreen.classList.contains("hidden") ) { if (event.key === "ArrowRight") { event.preventDefault(); selectedIndex = (selectedIndex + 1) % cards.length; updateSelection(); return; } if (event.key === "ArrowLeft") { event.preventDefault(); selectedIndex = (selectedIndex - 1 + cards.length) % cards.length; updateSelection(); return; } if (event.key === "Enter") { event.preventDefault(); cards[selectedIndex].click(); return; } } /* * ------------------------------------------------------ * RESULT SCREEN * ------------------------------------------------------ */ if ( !resultScreen.classList.contains("hidden") ) { if (event.key === "Escape") { event.preventDefault(); goBack(); return; } if (event.key === "ArrowLeft") { event.preventDefault(); goBack(); return; } } } ); /* * ========================================================== * TOUCH / SWIPE SUPPORT * ========================================================== * * Swipe changes selection. * * Selection is transient and therefore does NOT create * browser history. * * A subsequent tap/click creates the actual navigation. * ========================================================== */ let touchStartX = 0; let touchStartY = 0; document.addEventListener( "touchstart", function (event) { if ( !event.changedTouches || event.changedTouches.length === 0 ) { return; } touchStartX = event.changedTouches[0].screenX; touchStartY = event.changedTouches[0].screenY; }, { passive: true } ); document.addEventListener( "touchend", function (event) { if ( !event.changedTouches || event.changedTouches.length === 0 ) { return; } const touchEndX = event.changedTouches[0].screenX; const touchEndY = event.changedTouches[0].screenY; const deltaX = touchEndX - touchStartX; const deltaY = touchEndY - touchStartY; /* * Ignore mostly vertical movement. */ if ( Math.abs(deltaX) <= Math.abs(deltaY) ) { return; } /* * Swipe left */ if (deltaX < -50) { selectedIndex = (selectedIndex + 1) % cards.length; updateSelection(); return; } /* * Swipe right */ if (deltaX > 50) { selectedIndex = (selectedIndex - 1 + cards.length) % cards.length; updateSelection(); } }, { passive: true } ); /* * ========================================================== * INITIAL APPLICATION STATE * ========================================================== * * If the simulator starts at: * * / * * render home. * * If it starts at: * * /balance * * render Account Balance. * * No new history entry is created. * ========================================================== */ const initialScreen = getScreenFromPath( window.location.pathname ); renderScreen(initialScreen); /* * ========================================================== * INITIAL SELECTION * ========================================================== */ updateSelection(); </script> </body> </html>
