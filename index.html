<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Required 600 x 600 viewport -->
  <meta
    name="viewport"
    content="width=600, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <!-- Required app metadata -->
  <meta
    name="description"
    content="POWERCONNECT.AI wearable web app for Meta Ray-Ban Display glasses."
  >

  <meta
    name="mrbd-web-app-capable"
    content="yes"
  >

  <!-- Raster favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  >

  <title>POWERCONNECT.AI</title>

  <style>
    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 600px;
      height: 600px;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #000;
      color: #fff;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================================================
       ROOT
       ========================================================= */

    #root {
      width: 600px;
      height: 600px;
      overflow: hidden;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      width: 600px;
      height: 600px;

      padding: 24px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      width: 100%;
      min-height: 44px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 18px;

      flex-shrink: 0;
    }

    .logo {
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status {
      font-size: 18px;
      line-height: 1.35;
      opacity: 0.7;
    }

    /* =========================================================
       SCREEN
       ========================================================= */

    .screen {
      width: 100%;

      flex: 1;
      min-height: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;

      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       TYPOGRAPHY
       ========================================================= */

    .title {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;

      margin-bottom: 12px;

      overflow-wrap: break-word;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.4;

      margin-bottom: 24px;

      opacity: 0.75;

      overflow-wrap: break-word;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .card {
      width: 100%;
      min-height: 82px;

      border: 2px solid #555;
      border-radius: 14px;

      padding: 16px;
      margin-bottom: 10px;

      background: #000;
      color: #fff;

      cursor: pointer;

      display: flex;
      flex-direction: column;
      justify-content: center;

      outline: none;

      transition:
        transform 0.15s ease,
        border-color 0.15s ease;
    }

    .card:focus,
    .card.selected {
      border-color: #fff;
      transform: scale(1.01);
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-title {
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;

      margin-bottom: 5px;

      overflow-wrap: break-word;
    }

    .card-description {
      font-size: 18px;
      line-height: 1.35;

      opacity: 0.65;

      overflow-wrap: break-word;
    }

    /* =========================================================
       RESULT
       ========================================================= */

    .result-container {
      width: 100%;
    }

    .response {
      width: 100%;

      border: 2px solid #555;
      border-radius: 14px;

      padding: 20px;
      margin-bottom: 20px;

      overflow: hidden;
    }

    .response-label {
      font-size: 18px;
      line-height: 1.35;

      opacity: 0.65;

      margin-bottom: 8px;

      overflow-wrap: break-word;
    }

    .response-value {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;

      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* =========================================================
       BACK BUTTON
       ========================================================= */

    .back-button {
      width: 100%;
      min-height: 56px;

      border: 2px solid #555;
      border-radius: 12px;

      padding: 14px;

      background: #000;
      color: #fff;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      line-height: 1.35;
      font-weight: 600;

      outline: none;
    }

    .back-button:focus {
      border-color: #fff;
    }

    .back-button:active {
      transform: scale(0.98);
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      width: 100%;

      flex-shrink: 0;

      padding-top: 12px;

      text-align: center;

      font-size: 18px;
      line-height: 1.35;

      opacity: 0.5;

      overflow-wrap: break-word;
    }
  </style>
</head>

<body>

  <div id="root">

    <div class="app">

      <!-- =====================================================
           HEADER
           ===================================================== -->

      <header class="header">

        <div class="logo">
          POWERCONNECT.AI
        </div>

        <div
          class="status"
          id="status"
        >
          ONLINE
        </div>

      </header>


      <!-- =====================================================
           HOME SCREEN
           URL: /
           ===================================================== -->

      <main
        id="homeScreen"
        class="screen"
        aria-label="POWERCONNECT home"
      >

        <div class="title">
          Hello
        </div>

        <div class="subtitle">
          What would you like to check?
        </div>


        <!-- ACCOUNT BALANCE -->

        <div
          id="balanceCard"
          class="card"
          tabindex="0"
          role="button"
          aria-label="Account Balance"
        >

          <div class="card-title">
            Account Balance
          </div>

          <div class="card-description">
            View your current balance
          </div>

        </div>


        <!-- LATEST BILL -->

        <div
          id="billCard"
          class="card"
          tabindex="0"
          role="button"
          aria-label="Latest Bill"
        >

          <div class="card-title">
            Latest Bill
          </div>

          <div class="card-description">
            View your latest billing information
          </div>

        </div>


        <!-- USAGE -->

        <div
          id="usageCard"
          class="card"
          tabindex="0"
          role="button"
          aria-label="Usage"
        >

          <div class="card-title">
            Usage
          </div>

          <div class="card-description">
            View your electricity usage
          </div>

        </div>

      </main>


      <!-- =====================================================
           RESULT SCREEN
           URLS:
             /balance
             /bill
             /usage
           ===================================================== -->

      <main
        id="resultScreen"
        class="screen hidden"
        aria-label="POWERCONNECT result"
      >

        <div class="result-container">

          <div
            id="resultTitle"
            class="title"
          >
            Account Balance
          </div>


          <div class="response">

            <div
              id="responseLabel"
              class="response-label"
            >
              CURRENT BALANCE
            </div>

            <div
              id="responseValue"
              class="response-value"
            >
              $124.52
            </div>

          </div>


          <div
            id="backButton"
            class="back-button"
            tabindex="0"
            role="button"
            aria-label="Back"
          >
            ← Back
          </div>

        </div>

      </main>


      <!-- =====================================================
           FOOTER
           ===================================================== -->

      <footer class="footer">
        Swipe to navigate • Pinch to select
      </footer>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       EVERYTHING IS INSIDE THIS HTML FILE
       ========================================================= -->

<script>
  /* ============================================================
     SCREEN CONFIGURATION
     ============================================================ */

  const screens = {
    home: {
      screen: "home",
      title: "POWERCONNECT.AI",
      label: "",
      value: ""
    },

    balance: {
      screen: "balance",
      title: "Account Balance",
      label: "CURRENT BALANCE",
      value: "$124.52"
    },

    bill: {
      screen: "bill",
      title: "Latest Bill",
      label: "AMOUNT DUE",
      value: "$86.41"
    },

    usage: {
      screen: "usage",
      title: "Usage",
      label: "CURRENT USAGE",
      value: "642 kWh"
    }
  };


  /* ============================================================
     DOM ELEMENTS
     ============================================================ */

  const homeScreen =
    document.getElementById("homeScreen");

  const resultScreen =
    document.getElementById("resultScreen");

  const resultTitle =
    document.getElementById("resultTitle");

  const responseLabel =
    document.getElementById("responseLabel");

  const responseValue =
    document.getElementById("responseValue");

  const backButton =
    document.getElementById("backButton");

  const balanceCard =
    document.getElementById("balanceCard");

  const billCard =
    document.getElementById("billCard");

  const usageCard =
    document.getElementById("usageCard");


  /* ============================================================
     READ SCREEN FROM CURRENT URL
     
     /
     /?screen=balance
     /?screen=bill
     /?screen=usage
     ============================================================ */

  function getCurrentScreen() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const screen =
      params.get("screen");

    if (
      screen &&
      Object.prototype.hasOwnProperty.call(
        screens,
        screen
      )
    ) {
      return screen;
    }

    return "home";
  }


  /* ============================================================
     BUILD URL FOR SCREEN
     ============================================================ */

  function getScreenUrl(screenName) {

    if (screenName === "home") {
      return window.location.pathname;
    }

    return (
      window.location.pathname +
      "?screen=" +
      encodeURIComponent(screenName)
    );
  }


  /* ============================================================
     RENDER SCREEN
     
     IMPORTANT:
     This function NEVER modifies browser history.
     ============================================================ */

  function renderScreen(screenName) {

    const screen =
      screens[screenName] ||
      screens.home;


    /* HOME */

    if (screenName === "home") {

      homeScreen.classList.remove("hidden");

      resultScreen.classList.add("hidden");

      return;
    }


    /* RESULT SCREEN */

    homeScreen.classList.add("hidden");

    resultScreen.classList.remove("hidden");


    resultTitle.textContent =
      screen.title;

    responseLabel.textContent =
      screen.label;

    responseValue.textContent =
      screen.value;


    /*
     * Focus is transient UI state.
     * It does NOT create history.
     */

    backButton.focus();
  }


  /* ============================================================
     NAVIGATE
     
     THIS IS THE IMPORTANT QA FIX.
     
     Every actual application screen change creates a
     same-origin browser history entry.
     ============================================================ */

  function navigateTo(screenName) {

    if (
      !Object.prototype.hasOwnProperty.call(
        screens,
        screenName
      )
    ) {
      return;
    }


    const currentScreen =
      getCurrentScreen();


    /*
     * Don't create duplicate history entries.
     */

    if (currentScreen === screenName) {
      return;
    }


    const url =
      getScreenUrl(screenName);


    /*
     * REAL BROWSER HISTORY ENTRY
     */

    window.history.pushState(
      {
        screen: screenName
      },
      "",
      url
    );


    /*
     * Render the new application screen.
     */

    renderScreen(screenName);
  }


  /* ============================================================
     CARD CLICK EVENTS
     ============================================================ */

  balanceCard.addEventListener(
    "click",
    function () {
      navigateTo("balance");
    }
  );


  billCard.addEventListener(
    "click",
    function () {
      navigateTo("bill");
    }
  );


  usageCard.addEventListener(
    "click",
    function () {
      navigateTo("usage");
    }
  );


  /* ============================================================
     BROWSER BACK / FORWARD
     
     DO NOT CALL pushState() HERE.
     ============================================================ */

  window.addEventListener(
    "popstate",
    function () {

      const screenName =
        getCurrentScreen();

      renderScreen(screenName);
    }
  );


  /* ============================================================
     BACK BUTTON
     ============================================================ */

  backButton.addEventListener(
    "click",
    function () {

      if (
        getCurrentScreen() !== "home"
      ) {

        window.history.back();

        return;
      }

      renderScreen("home");
    }
  );


  /* ============================================================
     KEYBOARD SELECTION
     
     Selection DOES NOT create history.
     ============================================================ */

  const cards = [
    balanceCard,
    billCard,
    usageCard
  ];

  let selectedIndex = 0;


  function updateSelection() {

    cards.forEach(
      function (card, index) {

        if (index === selectedIndex) {

          card.classList.add("selected");

          card.focus();

        } else {

          card.classList.remove("selected");
        }
      }
    );
  }


  document.addEventListener(
    "keydown",
    function (event) {

      /*
       * HOME
       */

      if (
        !homeScreen.classList.contains("hidden")
      ) {

        if (
          event.key === "ArrowRight"
        ) {

          event.preventDefault();

          selectedIndex =
            (selectedIndex + 1) %
            cards.length;

          updateSelection();

          return;
        }


        if (
          event.key === "ArrowLeft"
        ) {

          event.preventDefault();

          selectedIndex =
            (
              selectedIndex -
              1 +
              cards.length
            ) %
            cards.length;

          updateSelection();

          return;
        }


        /*
         * Enter = actual navigation
         */

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          cards[selectedIndex].click();

          return;
        }
      }


      /*
       * RESULT SCREEN
       */

      if (
        !resultScreen.classList.contains("hidden")
      ) {

        if (
          event.key === "Escape" ||
          event.key === "ArrowLeft"
        ) {

          event.preventDefault();

          window.history.back();

          return;
        }
      }
    }
  );


  /* ============================================================
     INITIAL RENDER
     
     IMPORTANT:
     Initial loading does NOT call pushState().
     ============================================================ */

  const initialScreen =
    getCurrentScreen();

  renderScreen(initialScreen);

  updateSelection();

</script>

</body>
</html>
